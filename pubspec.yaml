name: nhac_motoboy
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  go_router: ^18.0.0
  lottie: ^3.5.1
  nowa_runtime: ^0.1.3
  flutter_svg: ^2.0.17
  email_validator: ^3.0.0
  mask_text_input_formatter: ^2.9.0
  pin_code_fields: ^8.0.1
  provider: ^6.1.2
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  http: ^1.2.2
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  stomp_dart_client: ^2.1.2
  uuid: ^4.5.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
